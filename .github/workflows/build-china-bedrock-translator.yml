name: Build ChinaBedrock Translator

on:
  push:
    branches:
      - china-bedrock-translator
    paths:
      - 'ChinaBedrockTranslator/**'
      - '.github/workflows/build-china-bedrock-translator.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ChinaBedrockTranslator
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp ChinaBedrockTranslator/app/build/outputs/apk/debug/app-debug.apk out/ChinaBedrock-Translator-v0.1.0.apk
          sha256sum out/ChinaBedrock-Translator-v0.1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChinaBedrock-Translator-v0.1.0
          path: out/ChinaBedrock-Translator-v0.1.0.apk
          retention-days: 90
