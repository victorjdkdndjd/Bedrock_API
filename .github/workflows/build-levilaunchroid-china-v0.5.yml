name: Build LeviLaunchroid China Diagnostic v0.5

on:
  push:
    branches:
      - levilaunchroid-china-diagnostic
    paths:
      - .github/workflows/build-levilaunchroid-china-v0.5.yml
      - tools/apply_china_v05.py
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LeviLaunchroid upstream
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/LeviLaunchroid
          ref: main
          path: LeviLaunchroid
          fetch-depth: 1
          submodules: recursive

      - name: Restore and apply China v0.1 runtime patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/victorjdkdndjd/Bedrock_API/levilaunchroid-china-diagnostic/.github/workflows/build-levilaunchroid-china-side-by-side.yml -o /tmp/old.yml
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          text = Path('/tmp/old.yml').read_text()
          marker = "cat > /tmp/china_patcher.gz.b64 <<'B64'"
          start = text.index(marker) + len(marker)
          data=[]
          for line in text[start:].splitlines():
              s=line.strip()
              if not s: continue
              if s == 'B64': break
              data.append(s)
          Path('/tmp/china_patcher.py').write_bytes(gzip.decompress(base64.b64decode(''.join(data))))
          PY
          python3 /tmp/china_patcher.py LeviLaunchroid

      - name: Apply Android 15 China v0.5 patch
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/victorjdkdndjd/Bedrock_API/levilaunchroid-china-diagnostic/tools/apply_china_v05.py -o /tmp/apply_china_v05.py
          python3 /tmp/apply_china_v05.py

      - name: Prepare CI google-services.json
        shell: bash
        run: |
          cat > LeviLaunchroid/app/google-services.json <<'JSON'
          {
            "project_info": {"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},
            "client": [{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"org.levimc.launcher.china.v05"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyCIOnlyPlaceholderKey"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],
            "configuration_version":"1"
          }
          JSON

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build in-memory native loader DEX asset
        shell: bash
        run: |
          set -euo pipefail
          TMP=/tmp/china-native-thunk
          rm -rf "$TMP"
          mkdir -p "$TMP/src/org/levimc/chinabridge" "$TMP/classes" "$TMP/d8out" LeviLaunchroid/app/src/main/assets
          cat > "$TMP/src/org/levimc/chinabridge/NativeLoadThunk.java" <<'JAVA'
          package org.levimc.chinabridge;
          public final class NativeLoadThunk {
              private NativeLoadThunk() {}
              public static void load(String absolutePath) {
                  System.load(absolutePath);
              }
          }
          JAVA
          javac -source 8 -target 8 -d "$TMP/classes" "$TMP/src/org/levimc/chinabridge/NativeLoadThunk.java"
          jar cf "$TMP/thunk.jar" -C "$TMP/classes" .
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 26 --output "$TMP/d8out" "$TMP/thunk.jar"
          cp "$TMP/d8out/classes.dex" LeviLaunchroid/app/src/main/assets/china_native_load.dex
          ls -l LeviLaunchroid/app/src/main/assets/china_native_load.dex

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.9.9'

      - name: Setup Android NDK r28c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Build debug APK
        working-directory: LeviLaunchroid
        run: |
          chmod +x gradlew
          echo 'curseforge.api_key=' >> local.properties
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find LeviLaunchroid/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" out/LeviLauncher-China-Diagnostic-v0.5.apk
          sha256sum out/LeviLauncher-China-Diagnostic-v0.5.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-China-Diagnostic-v0.5
          path: out/LeviLauncher-China-Diagnostic-v0.5.apk
          retention-days: 90
