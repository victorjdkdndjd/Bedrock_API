name: Build LeviLaunchroid China Side-by-Side

on:
  push:
    branches:
      - levilaunchroid-china-diagnostic
    paths:
      - .github/workflows/build-levilaunchroid-china-side-by-side.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LeviLaunchroid upstream
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/LeviLaunchroid
          ref: main
          path: LeviLaunchroid
          fetch-depth: 1
          submodules: recursive

      - name: Apply China diagnostic patch
        shell: bash
        run: |
          cat > /tmp/china_patcher.gz.b64 <<'B64'
          
          B64
          base64 --decode /tmp/china_patcher.gz.b64 | gzip -d > /tmp/china_patcher.py
          python3 /tmp/china_patcher.py LeviLaunchroid --check
          python3 /tmp/china_patcher.py LeviLaunchroid

      - name: Make diagnostic app side-by-side
        shell: bash
        run: |
          sed -i 's/applicationId "org.levimc.launcher"/applicationId "org.levimc.launcher.china"/' LeviLaunchroid/app/build.gradle
          sed -i 's#<string name="app_name">LeviLauncher</string>#<string name="app_name">LeviLauncher China Test</string>#' LeviLaunchroid/app/src/main/res/values/strings.xml
          grep -q 'applicationId "org.levimc.launcher.china"' LeviLaunchroid/app/build.gradle

      - name: Prepare CI google-services.json
        shell: bash
        working-directory: LeviLaunchroid
        run: |
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},
            "client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"org.levimc.launcher.china"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyCIOnlyPlaceholderKey"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],
            "configuration_version":"1"
          }
          JSON

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.9.9'
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'levilaunchroid-china-side-by-side'

      - name: Setup Android NDK r28c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Build debug APK
        working-directory: LeviLaunchroid
        run: |
          chmod +x ./gradlew
          printf '\ncurseforge.api_key=\n' >> local.properties
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          cp LeviLaunchroid/app/build/outputs/apk/debug/*.apk output/LeviLauncher-China-Diagnostic-v0.1-side-by-side.apk
          sha256sum output/LeviLauncher-China-Diagnostic-v0.1-side-by-side.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLauncher-China-Diagnostic-v0.1-side-by-side
          path: output/LeviLauncher-China-Diagnostic-v0.1-side-by-side.apk
          if-no-files-found: error
