name: Build Victor Java Launcher Offline

on:
  push:
    branches:
      - victor-java-launcher-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Clone Amethyst
        run: |
          git clone --branch v3_openjdk --recurse-submodules https://github.com/AngelAuraMC/Amethyst-Android.git amethyst

      - name: Get JRE 8 asset used by upstream build
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: amethyst/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Apply Victor v0.4 base patch
        working-directory: amethyst
        run: python3 ../build/victor_patch.py

      - name: Apply v0.4.1 jar import fix
        working-directory: amethyst
        run: python3 ../build/victor_jar_import_patch.py

      - name: Prepare sources
        working-directory: amethyst
        run: |
          chmod +x scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh

      - name: Build debug APK
        working-directory: amethyst
        run: gradle :app_pojavlauncher:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp amethyst/app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/VictorJavaLauncher-Offline-v0.4.1-debug.apk
          sha256sum out/VictorJavaLauncher-Offline-v0.4.1-debug.apk > out/VictorJavaLauncher-Offline-v0.4.1-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VictorJavaLauncher-Offline-v0.4.1-debug
          path: out/*
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VictorJavaLauncher-build-diagnostics-v0.4.1
          path: |
            amethyst/app_pojavlauncher/build/reports/**
            amethyst/app_pojavlauncher/build/outputs/logs/**
          if-no-files-found: ignore
