name: Build LeviLaunchroid China Diagnostic v0.3.1

on:
  push:
    branches:
      - levilaunchroid-china-diagnostic
    paths:
      - .github/workflows/build-levilaunchroid-china-v0.3.1.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LeviLaunchroid upstream
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/LeviLaunchroid
          ref: main
          path: LeviLaunchroid
          fetch-depth: 1
          submodules: recursive

      - name: Restore and apply China v0.1 runtime patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/victorjdkdndjd/Bedrock_API/levilaunchroid-china-diagnostic/.github/workflows/build-levilaunchroid-china-side-by-side.yml \
            -o /tmp/old-china-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          text = Path('/tmp/old-china-workflow.yml').read_text()
          marker = "cat > /tmp/china_patcher.gz.b64 <<'B64'"
          start = text.index(marker) + len(marker)
          tail = text[start:].splitlines()
          data = []
          started = False
          for line in tail:
              s = line.strip()
              if not started:
                  if not s:
                      continue
                  started = True
              if s == 'B64':
                  break
              data.append(s)
          raw = base64.b64decode(''.join(data))
          Path('/tmp/china_patcher.py').write_bytes(gzip.decompress(raw))
          PY
          python3 /tmp/china_patcher.py LeviLaunchroid

      - name: Add NetEase APK import compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('LeviLaunchroid')

          apk_utils = root / 'app/src/main/java/org/levimc/launcher/util/ApkUtils.java'
          text = apk_utils.read_text()
          old = '"com.mojang.minecraftpe".equals(packageName) && versionName != null && !versionName.isEmpty()'
          new = '("com.mojang.minecraftpe".equals(packageName) || "com.netease.x19".equals(packageName)) && versionName != null && !versionName.isEmpty()'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'ApkUtils expected 3 package checks, found {count}')
          apk_utils.write_text(text.replace(old, new))

          installer = root / 'app/src/main/java/org/levimc/launcher/util/ApkInstaller.java'
          text = installer.read_text()
          old = '"com.mojang.minecraftpe".equals(pkgName) && vName != null && !vName.isEmpty()'
          new = '("com.mojang.minecraftpe".equals(pkgName) || "com.netease.x19".equals(pkgName)) && vName != null && !vName.isEmpty()'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'ApkInstaller expected 1 package check, found {count}')
          installer.write_text(text.replace(old, new))

          manifest = root / 'app/src/main/AndroidManifest.xml'
          text = manifest.read_text()
          needle = '        <package android:name="com.mojang.minecraftpe" />\n'
          if 'com.netease.x19' not in text:
              if needle not in text:
                  raise SystemExit('Manifest Minecraft query anchor not found')
              text = text.replace(needle, needle + '        <package android:name="com.netease.x19" />\n', 1)
          manifest.write_text(text)
          PY

      - name: Add NetEase DexClassLoader native bridge
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE=LeviLaunchroid/app/src/main/java/org/levimc/launcher/core/minecraft/ChinaDexLoader.java
          cat > "$BRIDGE" <<'JAVA'
          package org.levimc.launcher.core.minecraft;

          import android.content.Context;
          import android.content.pm.ApplicationInfo;
          import android.util.Log;

          import java.io.File;
          import java.lang.reflect.InvocationTargetException;
          import java.lang.reflect.Method;
          import java.util.ArrayList;
          import java.util.List;

          import dalvik.system.DexClassLoader;

          public final class ChinaDexLoader {
              private static final String TAG = "ChinaDexLoader";
              private static final String ANCHOR = "com.netease.androidcrashhandler.NTCrashHunterKit";
              private static DexClassLoader loader;
              private static Class<?> anchorClass;
              private static Method runtimeLoad0;

              private ChinaDexLoader() {}

              private static synchronized void ensure(Context context, ApplicationInfo appInfo, String nativeLibDir) throws Exception {
                  if (loader != null && anchorClass != null && runtimeLoad0 != null) return;

                  List<String> apkPaths = new ArrayList<>();
                  if (appInfo.sourceDir != null && new File(appInfo.sourceDir).isFile()) {
                      apkPaths.add(appInfo.sourceDir);
                  }
                  if (appInfo.splitSourceDirs != null) {
                      for (String split : appInfo.splitSourceDirs) {
                          if (split != null && new File(split).isFile()) apkPaths.add(split);
                      }
                  }
                  if (apkPaths.isEmpty()) {
                      throw new IllegalStateException("Minecraft China APK path list is empty");
                  }

                  String dexPath = String.join(File.pathSeparator, apkPaths);
                  File optimized = new File(context.getCodeCacheDir(), "netease_dex");
                  if (!optimized.exists() && !optimized.mkdirs()) {
                      throw new IllegalStateException("Cannot create NetEase dex cache: " + optimized);
                  }

                  loader = new DexClassLoader(
                          dexPath,
                          optimized.getAbsolutePath(),
                          nativeLibDir,
                          context.getClassLoader()
                  );

                  anchorClass = Class.forName(ANCHOR, false, loader);
                  runtimeLoad0 = Runtime.class.getDeclaredMethod("load0", Class.class, String.class);
                  runtimeLoad0.setAccessible(true);

                  Log.i(TAG, "NetEase DexClassLoader ready; anchor=" + anchorClass
                          + ", source=" + anchorClass.getProtectionDomain());
              }

              public static void load(Context context, ApplicationInfo appInfo, String nativeLibDir, String absolutePath) throws Exception {
                  ensure(context, appInfo, nativeLibDir);
                  try {
                      runtimeLoad0.invoke(Runtime.getRuntime(), anchorClass, absolutePath);
                      Log.i(TAG, "Loaded with NetEase classloader: " + absolutePath);
                  } catch (InvocationTargetException e) {
                      Throwable cause = e.getCause();
                      if (cause instanceof Error) throw (Error) cause;
                      if (cause instanceof Exception) throw (Exception) cause;
                      throw new RuntimeException(cause);
                  }
              }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          p = Path('LeviLaunchroid/app/src/main/java/org/levimc/launcher/core/minecraft/GamePackageManager.kt')
          text = p.read_text()
          old = '''                System.load(libFile.absolutePath)'''
          new = '''                if (isChinaRuntime) {
                    report("China Java bridge loading $fileName through imported APK DexClassLoader")
                    ChinaDexLoader.load(context, applicationInfo, nativeLibDir, libFile.absolutePath)
                } else {
                    System.load(libFile.absolutePath)
                }'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one extracted System.load anchor, found {count}')
          p.write_text(text.replace(old, new, 1))
          print('China DexClassLoader bridge applied')
          PY

      - name: Make v0.3.1 install as a separate test app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('LeviLaunchroid')
          gradle = root / 'app/build.gradle'
          text = gradle.read_text()
          old = 'applicationId "org.levimc.launcher"'
          if old not in text:
              raise SystemExit('applicationId anchor not found')
          gradle.write_text(text.replace(old, 'applicationId "org.levimc.launcher.china.v03"', 1))

          strings = root / 'app/src/main/res/values/strings.xml'
          text = strings.read_text()
          text = text.replace('<string name="app_name">LeviLauncher</string>', '<string name="app_name">LeviLauncher China Test v0.3.1</string>', 1)
          strings.write_text(text)
          PY

      - name: Prepare CI google-services.json
        shell: bash
        run: |
          mkdir -p LeviLaunchroid/app
          cat > LeviLaunchroid/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": {"package_name": "org.levimc.launcher.china.v03"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyCIOnlyPlaceholderKey"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android build tools
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.9.9'

      - name: Setup Android NDK r28c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Build debug APK
        working-directory: LeviLaunchroid
        shell: bash
        run: |
          chmod +x gradlew
          echo 'curseforge.api_key=' >> local.properties
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          APK=$(find LeviLaunchroid/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" out/LeviLauncher-China-Diagnostic-v0.3.1.apk
          sha256sum out/LeviLauncher-China-Diagnostic-v0.3.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-China-Diagnostic-v0.3.1
          path: out/LeviLauncher-China-Diagnostic-v0.3.1.apk
          retention-days: 90
